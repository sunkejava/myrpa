name: Frontend Build

on:
  push:
    paths:
      - 'src/frontend/**'
      - '.github/workflows/frontend-build.yml'
  pull_request:
    paths:
      - 'src/frontend/**'
      - '.github/workflows/frontend-build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: npm install
      - name: Build
        run: npm run build
