name: Frontend Build

on:
  push:
    paths:
      - 'src/frontend/**'
      - 'src/backend/**'
      - '.github/workflows/frontend-build.yml'
  pull_request:
    paths:
      - 'src/frontend/**'
      - 'src/backend/**'
      - '.github/workflows/frontend-build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Install
        run: npm ci
      - name: Build
        run: npm run build
      - name: Install browser
        run: |
          npx playwright install --with-deps chromium
          npx playwright@1.55.0 install chromium
      - name: Build browser execution node
        run: dotnet build ../backend/AgentRPA.NodeAgent/AgentRPA.NodeAgent.csproj --configuration Release
      - name: Browser integration tests
        env:
          ASPNETCORE_ENVIRONMENT: Development
          ASPNETCORE_URLS: http://127.0.0.1:5000
          AgentRPA__Bootstrap__AdminPassword: BrowserTestPassword123!
          ConnectionStrings__AgentRPA: Data Source=browser-test.db
          VITE_API_PROXY_TARGET: http://127.0.0.1:5000
          NodeAuthentication__RegistrationKey: BrowserNodeRegistrationKey123!
        run: |
          set -euo pipefail
          dotnet run --project ../backend/AgentRPA.Api/AgentRPA.Api.csproj > api-browser.log 2>&1 &
          api_pid=$!
          trap 'kill "$api_pid" 2>/dev/null || true; cat api-browser.log' EXIT
          for attempt in $(seq 1 80); do
            if curl -fsS http://127.0.0.1:5000/swagger/v1/swagger.json >/dev/null; then break; fi
            if ! kill -0 "$api_pid" 2>/dev/null; then exit 1; fi
            sleep 1
          done
          # A 307/308 from the API would redirect Vite's HTTP proxy to HTTPS and break login preflight.
          status=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:5000/api/auth/me)
          test "$status" = 401
          npm run test:e2e
          # Keep one enrolled employee and a receipt while the API process is restarted.
          curl -fsS -c mock-cookies.txt -d 'username=demo&password=Demo123!' \
            -o /dev/null http://127.0.0.1:5000/mock/qd-social-security/login
          curl -fsS -b mock-cookies.txt \
            -d 'operation=add&employeeName=RestartEmployee&idNumber=11010519491231002X&submissionId=restart-check-001' \
            http://127.0.0.1:5000/mock/qd-social-security/employees > initial-receipt.html
          grep -q '增员申报成功' initial-receipt.html
          kill "$api_pid"
          wait "$api_pid" || true
          dotnet run --project ../backend/AgentRPA.Api/AgentRPA.Api.csproj > api-restart.log 2>&1 &
          api_pid=$!
          for attempt in $(seq 1 80); do
            if curl -fsS http://127.0.0.1:5000/swagger/v1/swagger.json >/dev/null; then break; fi
            if ! kill -0 "$api_pid" 2>/dev/null; then cat api-restart.log; exit 1; fi
            sleep 1
          done
          curl -fsS -c mock-cookies.txt -d 'username=demo&password=Demo123!' \
            -o /dev/null http://127.0.0.1:5000/mock/qd-social-security/login
          curl -fsS -b mock-cookies.txt \
            'http://127.0.0.1:5000/mock/qd-social-security/employees/status?idNumber=11010519491231002X' \
            | python3 -c 'import json,sys; assert json.load(sys.stdin) == {"active": True, "employeeName": "RestartEmployee"}'
          curl -fsS -b mock-cookies.txt \
            -d 'operation=add&employeeName=RestartEmployee&idNumber=11010519491231002X&submissionId=restart-check-001' \
            http://127.0.0.1:5000/mock/qd-social-security/employees > replay-receipt.html
          grep -q '增员申报成功' replay-receipt.html
      - name: Upload browser traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-results
          path: src/frontend/test-results/
          if-no-files-found: ignore
