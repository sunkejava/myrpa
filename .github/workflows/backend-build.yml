name: Backend Build

on:
  push:
    branches: [ main ]
    paths:
      - 'src/backend/**'
      - '*.sln'
      - 'Directory.Build.props'
      - '.github/workflows/backend-build.yml'
  pull_request:
    paths:
      - 'src/backend/**'
      - '*.sln'
      - 'Directory.Build.props'
      - '.github/workflows/backend-build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DOTNET_NOLOGO: 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore AgentRPA.sln
      - name: Build
        run: dotnet build AgentRPA.sln --configuration Release --no-restore
      - name: Start API and verify login and access control
        env:
          ASPNETCORE_ENVIRONMENT: Development
          ASPNETCORE_URLS: http://127.0.0.1:5017
          ConnectionStrings__AgentRPA: Data Source=smoke-test.db
          AgentRPA__Bootstrap__AdminPassword: SmokeTestPassword123!
        run: |
          set -euo pipefail
          dotnet run --project src/backend/AgentRPA.Api/AgentRPA.Api.csproj --configuration Release --no-build > api-smoke.log 2>&1 &
          api_pid=$!
          trap 'kill "$api_pid" 2>/dev/null || true; cat api-smoke.log' EXIT
          for attempt in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:5017/swagger/v1/swagger.json >/dev/null; then break; fi
            if ! kill -0 "$api_pid" 2>/dev/null; then exit 1; fi
            sleep 1
          done
          python3 - <<'PY'
          import json, urllib.error, urllib.request
          base = 'http://127.0.0.1:5017'
          payload = json.dumps({'userName': 'admin', 'password': 'SmokeTestPassword123!'}).encode()
          with urllib.request.urlopen(urllib.request.Request(base + '/api/auth/login', payload, {'Content-Type': 'application/json'})) as response:
              token = json.load(response)['accessToken']
          with urllib.request.urlopen(urllib.request.Request(base + '/api/auth/me', headers={'Authorization': 'Bearer ' + token})) as response:
              assert json.load(response)['userName'] == 'admin'
          with urllib.request.urlopen(urllib.request.Request(base + '/api/tasks', headers={'Authorization': 'Bearer ' + token})) as response:
              assert isinstance(json.load(response), list)
          for path in ('/api/tasks', '/api/workflows', '/api/audit', '/api/node-management/nodes'):
              try:
                  urllib.request.urlopen(base + path)
                  raise AssertionError(f'Anonymous request unexpectedly succeeded: {path}')
              except urllib.error.HTTPError as error:
                  assert error.code == 401, (path, error.code)
          def post(path, data, bearer):
              request = urllib.request.Request(base + path, json.dumps(data).encode(),
                  {'Content-Type': 'application/json', 'Authorization': 'Bearer ' + bearer})
              with urllib.request.urlopen(request) as response:
                  return json.load(response)
          user = post('/api/user-management/users',
              {'userName': 'usera', 'displayName': '测试用户', 'password': 'UserATestPassword123!'}, token)
          with urllib.request.urlopen(urllib.request.Request(base + '/api/auth/login',
              json.dumps({'userName': 'usera', 'password': 'UserATestPassword123!'}).encode(),
              {'Content-Type': 'application/json'})) as response:
              user_token = json.load(response)['accessToken']
          try:
              post('/api/business-resources/cities', {'code': 'CN-SD-QD', 'name': '青岛市'}, user_token)
              raise AssertionError('Non-admin created a city')
          except urllib.error.HTTPError as error:
              assert error.code == 403, error.code
          country = post('/api/business-resources/countries', {'code': 'CN', 'name': '中国'}, token)
          province = post(f'/api/business-resources/countries/{country["id"]}/provinces',
              {'code': 'SD', 'name': '山东省'}, token)
          qd = post('/api/business-resources/cities',
              {'code': 'CN-SD-QD', 'name': '青岛市', 'provinceId': province['id']}, token)
          district = post(f'/api/business-resources/cities/{qd["id"]}/districts',
              {'code': 'SN', 'name': '市南区'}, token)
          with urllib.request.urlopen(urllib.request.Request(base + f'/api/business-resources/cities/{qd["id"]}/districts',
              headers={'Authorization': 'Bearer ' + user_token})) as response:
              assert any(x['id'] == district['id'] for x in json.load(response))
          jn = post('/api/business-resources/cities', {'code': 'CN-SD-JN', 'name': '济南市'}, token)
          def add_function(city):
              system = post(f'/api/business-resources/cities/{city["id"]}/systems',
                  {'code': 'SOCIAL', 'name': '社保系统'}, token)
              return system, post(f'/api/business-resources/systems/{system["id"]}/functions',
                  {'code': 'EMPLOYEE.ADD', 'name': '增员'}, token)
          qd_system, qd_function = add_function(qd)
          jn_system, jn_function = add_function(jn)
          def check(city, system, function):
              try:
                  post('/api/agent/check-permission', {'cityId': city['id'], 'systemId': system['id'],
                      'functionId': function['id'], 'action': 'Execute'}, user_token)
                  return 200
              except urllib.error.HTTPError as error:
                  return error.code
          assert check(qd, qd_system, qd_function) == 403
          post('/api/permission-policies', {'subjectId': user['id'], 'cityId': qd['id'],
              'systemId': qd_system['id'], 'functionId': qd_function['id'], 'action': 'Execute'}, token)
          assert check(qd, qd_system, qd_function) == 200
          post(f'/api/business-resources/provinces/{province["id"]}/enabled', {'enabled': False}, token)
          assert check(qd, qd_system, qd_function) == 403
          def rejects(path, payload, status=404):
              try:
                  post(path, payload, token)
                  raise AssertionError(f'{path} should reject disabled parent')
              except urllib.error.HTTPError as error:
                  assert error.code == status, (path, error.code)
          rejects(f'/api/business-resources/cities/{qd["id"]}/districts', {'code': 'LAOSHAN', 'name': '崂山区'})
          rejects(f'/api/business-resources/cities/{qd["id"]}/systems', {'code': 'SECOND', 'name': '第二系统'})
          rejects(f'/api/business-resources/systems/{qd_system["id"]}/functions', {'code': 'SECOND', 'name': '第二功能'})
          blocked_role = post('/api/user-management/roles', {'name': 'QingdaoOperator', 'displayName': '青岛社保操作员'}, token)
          rejects('/api/role-policies', {'roleId': blocked_role['id'], 'cityId': qd['id'],
              'systemId': qd_system['id'], 'functionId': qd_function['id'], 'action': 'Execute'}, 400)
          post(f'/api/business-resources/provinces/{province["id"]}/enabled', {'enabled': True}, token)
          assert check(qd, qd_system, qd_function) == 200
          post(f'/api/business-resources/countries/{country["id"]}/enabled', {'enabled': False}, token)
          assert check(qd, qd_system, qd_function) == 403
          post(f'/api/business-resources/countries/{country["id"]}/enabled', {'enabled': True}, token)
          assert check(qd, qd_system, qd_function) == 200
          post('/api/permission-policies/deny', {'subjectId': user['id'], 'cityId': qd['id'],
              'systemId': qd_system['id'], 'functionId': qd_function['id'], 'action': 'Execute'}, token)
          assert check(qd, qd_system, qd_function) == 403
          post('/api/permission-policies', {'subjectId': user['id'], 'cityId': qd['id'],
              'systemId': qd_system['id'], 'functionId': qd_function['id'], 'action': 'Execute'}, token)
          assert check(qd, qd_system, qd_function) == 200
          assert check(jn, jn_system, jn_function) == 403
          assert check(qd, jn_system, jn_function) == 403
          role = post('/api/user-management/roles', {'name': 'JinanOperator', 'displayName': '济南社保操作员'}, token)
          post(f'/api/user-management/users/{user["id"]}/roles/{role["id"]}', {}, token)
          role_policy = post('/api/role-policies', {'roleId': role['id'], 'cityId': jn['id'],
              'systemId': jn_system['id'], 'functionId': jn_function['id'], 'action': 'Execute'}, token)
          assert check(jn, jn_system, jn_function) == 200
          denied = post('/api/permission-policies/deny', {'subjectId': user['id'], 'cityId': jn['id'],
              'systemId': jn_system['id'], 'functionId': jn_function['id'], 'action': 'Execute'}, token)
          assert check(jn, jn_system, jn_function) == 403
          post(f'/api/permission-policies/{denied["id"]}/revoke', {}, token)
          assert check(jn, jn_system, jn_function) == 200
          post(f'/api/role-policies/{role_policy["id"]}/revoke', {}, token)
          assert check(jn, jn_system, jn_function) == 403
          def publish_workflow(function, definition=None):
              workflow = post('/api/workflows',
                  {'businessFunctionId': function['id'], 'name': '测试流程', 'description': '权限冒烟测试'}, token)
              version = post(f'/api/workflows/{workflow["id"]}/versions',
                  {'definitionJson': definition or '{"steps":[{"type":"Navigate","config":{"url":"https://example.test"}}]}'}, token)
              post(f'/api/workflows/{workflow["id"]}/versions/{version["version"]}/publish', {}, token)
              return workflow, version
          qd_workflow, qd_version = publish_workflow(qd_function)
          jn_workflow, jn_version = publish_workflow(jn_function)
          def create_task(workflow, version):
              return post('/api/tasks', {'workflowId': workflow['id'], 'workflowVersion': version['version'],
                  'name': '员工任务', 'items': ['{}']}, user_token)
          task = create_task(qd_workflow, qd_version)
          assert task['id']
          post(f'/api/business-resources/cities/{qd["id"]}/enabled', {'enabled': False}, token)
          assert check(qd, qd_system, qd_function) == 403
          post(f'/api/business-resources/cities/{qd["id"]}/enabled', {'enabled': True}, token)
          assert check(qd, qd_system, qd_function) == 200
          protected_workflow, protected_version = publish_workflow(qd_function,
              '{"steps":[{"type":"Click","requiredAction":"Approve","config":{"selector":"#approve"}}]}')
          try:
              create_task(protected_workflow, protected_version)
              raise AssertionError('UserA bypassed Step Approve permission')
          except urllib.error.HTTPError as error:
              assert error.code == 403, error.code
          post('/api/permission-policies', {'subjectId': user['id'], 'cityId': qd['id'],
              'systemId': qd_system['id'], 'functionId': qd_function['id'], 'action': 'Approve'}, token)
          protected_task = create_task(protected_workflow, protected_version)
          assert protected_task['approvalRequired']
          try:
              create_task(jn_workflow, jn_version)
              raise AssertionError('UserA created a Jinan task without permission')
          except urllib.error.HTTPError as error:
              assert error.code == 403, error.code
          with urllib.request.urlopen(urllib.request.Request(base + '/api/task-approvals', headers={'Authorization': 'Bearer ' + token})) as response:
              approvals = json.load(response)
          approval = next(x for x in approvals if x['taskId'] == protected_task['id'])
          assert approval['status'] == 'Pending'
          try:
              post(f'/api/tasks/{protected_task["id"]}/queue', {}, user_token)
              raise AssertionError('Unapproved task was queued')
          except urllib.error.HTTPError as error:
              assert error.code == 428, error.code
          with urllib.request.urlopen(urllib.request.Request(base + '/api/user-management/roles', headers={'Authorization': 'Bearer ' + token})) as response:
              admin_role = next(x for x in json.load(response) if x['name'] == 'Admin')
          post(f'/api/user-management/users/{user["id"]}/roles/{admin_role["id"]}', {}, token)
          with urllib.request.urlopen(urllib.request.Request(base + '/api/auth/login',
              json.dumps({'userName': 'usera', 'password': 'UserATestPassword123!'}).encode(),
              {'Content-Type': 'application/json'})) as response:
              user_admin_token = json.load(response)['accessToken']
          try:
              post(f'/api/task-approvals/{approval["id"]}/decide', {'approved': True}, user_admin_token)
              raise AssertionError('Requester approved own task')
          except urllib.error.HTTPError as error:
              assert error.code == 403, error.code
          decided = post(f'/api/task-approvals/{approval["id"]}/decide', {'approved': True}, token)
          assert decided['status'] == 'Approved'
          try:
              post(f'/api/task-approvals/{approval["id"]}/decide', {'approved': False, 'reason': '再次审核'}, token)
              raise AssertionError('Approval was decided twice')
          except urllib.error.HTTPError as error:
              assert error.code == 409, error.code
          with urllib.request.urlopen(urllib.request.Request(base + f'/api/tasks/{protected_task["id"]}/queue', b'{}',
              {'Content-Type': 'application/json', 'Authorization': 'Bearer ' + user_token})) as response:
              assert response.status == 200
          rejected_task = create_task(protected_workflow, protected_version)
          with urllib.request.urlopen(urllib.request.Request(base + '/api/task-approvals', headers={'Authorization': 'Bearer ' + token})) as response:
              rejected_approval = next(x for x in json.load(response) if x['taskId'] == rejected_task['id'])
          rejected = post(f'/api/task-approvals/{rejected_approval["id"]}/decide',
              {'approved': False, 'reason': '资料不完整'}, token)
          assert rejected['status'] == 'Rejected'
          try:
              post(f'/api/tasks/{rejected_task["id"]}/queue', {}, user_token)
              raise AssertionError('Rejected task was queued')
          except urllib.error.HTTPError as error:
              assert error.code == 403, error.code
          post(f'/api/workflows/{protected_workflow["id"]}/disable', {}, token)
          try:
              create_task(protected_workflow, protected_version)
              raise AssertionError('Disabled workflow accepted new task')
          except urllib.error.HTTPError as error:
              assert error.code == 422, error.code
          print('API startup, login, administration and city-isolated permission checks passed')
          PY
