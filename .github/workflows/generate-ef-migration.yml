name: Generate EF Migration

on:
  push:
    branches: [main]
    paths:
      - 'src/backend/AgentRPA.Domain/**'
      - 'src/backend/AgentRPA.Application/**'
      - 'src/backend/AgentRPA.Infrastructure/**'
      - 'src/backend/AgentRPA.Api/**'
      - 'src/backend/**/*.csproj'
      - '.github/workflows/generate-ef-migration.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migration:
    if: ${{ !contains(github.event.head_commit.message, '[skip migration]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install dotnet-ef
        run: dotnet tool install --global dotnet-ef --version 10.0.0

      - name: Restore startup project
        run: dotnet restore src/backend/AgentRPA.Api/AgentRPA.Api.csproj

      - name: Build startup project
        run: dotnet build src/backend/AgentRPA.Api/AgentRPA.Api.csproj --configuration Release --no-restore

      - name: Generate migration for model changes
        shell: bash
        run: |
          set -euo pipefail
          migration_name="Auto_$(date -u +%Y%m%d%H%M%S)"
          dotnet ef migrations add "$migration_name" \
            --project src/backend/AgentRPA.Infrastructure/AgentRPA.Infrastructure.csproj \
            --startup-project src/backend/AgentRPA.Api/AgentRPA.Api.csproj \
            --output-dir Persistence/Migrations \
            --configuration Release \
            --no-build

      - name: Commit generated migration
        shell: bash
        run: |
          set -euo pipefail
          migration_dir='src/backend/AgentRPA.Infrastructure/Persistence/Migrations'
          migration_files=$(find "$migration_dir" -maxdepth 1 -type f -name '*.cs' -newermt "$(git show -s --format=%cI HEAD)" -print)
          if [ -z "$migration_files" ]; then
            echo 'No new migration files were generated; model is unchanged.'
            exit 0
          fi
          git add -f "$migration_dir"/*.cs
          if git diff --cached --quiet -- "$migration_dir"; then
            echo 'No migration changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: 自动生成 EF Core Migration [skip migration]'
          git push
